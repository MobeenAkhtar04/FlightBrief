# After getting your Let's Encrypt cert (see README for certbot command),
# replace YOURDOMAIN below with your actual domain name.

server {
    listen 80;
    server_name _;
    # redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    # swap these two lines in after running certbot:
    ssl_certificate     /etc/letsencrypt/live/flightbrief.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flightbrief.app/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # serve built frontend
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy all API routes to the api container
    location ~ ^/(brief|briefings|auth|health) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
